name: COS Diagnostics

# 仅用于手动复现 GitHub Hosted Runner 到腾讯 COS 的上传链路，
# 不参与 CI 或正式发布。
on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnose:
    name: Diagnose COS connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COS_BUCKET: echo-loop-public-1451816464
      COS_ENDPOINT: cos.ap-nanjing.myqcloud.com
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}

    steps:
      - name: Check DNS and TLS connectivity
        run: |
          set -Eeuo pipefail
          COS_HOST="${COS_BUCKET}.${COS_ENDPOINT}"
          echo "Resolving ${COS_HOST}..."
          getent ahostsv4 "$COS_HOST" || true
          echo "Connecting to https://${COS_HOST}/..."
          curl --verbose --connect-timeout 15 --max-time 30 \
            --output /dev/null "https://${COS_HOST}/" || true

      - name: Download COSCLI
        run: |
          set -Eeuo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
            "https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64" \
            -o "$RUNNER_TEMP/coscli"
          chmod +x "$RUNNER_TEMP/coscli"

      - name: Upload and remove diagnostic object
        id: upload
        run: |
          set -Eeuo pipefail
          : "${COS_SECRET_ID:?COS_SECRET_ID secret is required}"
          : "${COS_SECRET_KEY:?COS_SECRET_KEY secret is required}"

          COSCLI="$RUNNER_TEMP/coscli"
          TEST_FILE="$RUNNER_TEMP/cos-upload-probe.bin"
          OBJECT_URI="cos://${COS_BUCKET}/android/diagnostics/github-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bin"
          dd if=/dev/zero of="$TEST_FILE" bs=1M count=1 status=none

          cleanup() {
            local result=$?
            rm -f "$TEST_FILE"
            if [[ "${uploaded:-false}" == "true" ]]; then
              echo "Removing diagnostic object ${OBJECT_URI}..."
              "$COSCLI" --init-skip \
                --secret-id "$COS_SECRET_ID" --secret-key "$COS_SECRET_KEY" \
                --endpoint "$COS_ENDPOINT" --protocol https \
                rm "$OBJECT_URI" || echo "WARNING: failed to remove diagnostic object." >&2
            fi
            exit "$result"
          }
          trap cleanup EXIT

          uploaded=false
          echo "Uploading 1 MiB diagnostic object to ${OBJECT_URI}..."
          set +e
          timeout 120 "$COSCLI" --init-skip \
            --secret-id "$COS_SECRET_ID" --secret-key "$COS_SECRET_KEY" \
            --endpoint "$COS_ENDPOINT" --protocol https \
            cp "$TEST_FILE" "$OBJECT_URI" \
            --parallel 10 \
            --meta "Content-Type:application/octet-stream"
          upload_exit_code=$?
          set -e
          if [[ "$upload_exit_code" -ne 0 ]]; then
            echo "COS diagnostic upload failed with exit code ${upload_exit_code}." >&2
            exit "$upload_exit_code"
          fi
          uploaded=true
          echo "COS diagnostic upload succeeded."

      - name: Upload COSCLI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coscli-diagnostics-${{ github.run_id }}
          path: coscli_output/
          if-no-files-found: ignore
          retention-days: 7
